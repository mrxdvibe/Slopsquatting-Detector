name: "Slopsquatting Security Scan"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Kodu yüklə
      uses: actions/checkout@v4

    - name: Python quraşdır
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Aləti quraşdır
      run: |
        python -m pip install --upgrade pip
        pip install -e .   # Bu, yalnız layihənin özünü (və təmiz requirements.txt-i) yükləyəcək

    - name: Zəhərli faylı yoxla (Test)
      run: |
        # Biz qəsdən --fail-on-danger istifadə etmirik ki, test uğurlu saysın
        slopdetect test_requirements.txt
